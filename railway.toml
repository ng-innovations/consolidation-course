# Railway tells Nixpacks to build and run from server/.
# The Express server there serves the static course content from STATIC_DIR=.. (the repo root)
# behind the Microsoft SSO gate. See server/.env.example for required env vars.

[build]
builder = "nixpacks"
buildCommand = "cd server && npm ci"

[deploy]
startCommand = "cd server && npm start"
restartPolicyType = "always"
